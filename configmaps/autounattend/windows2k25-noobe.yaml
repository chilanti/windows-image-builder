apiVersion: v1
kind: ConfigMap
metadata:
  name: windows2k25-nooobe-autounattend
data:
  autounattend.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
      <settings pass="windowsPE">
        <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <SetupUILanguage>
            <UILanguage>en-US</UILanguage>
          </SetupUILanguage>
          <InputLocale>0409:00000409</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UILanguage>en-US</UILanguage>
          <UserLocale>en-US</UserLocale>
        </component>
        <component name="Microsoft-Windows-PnpCustomizationsWinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <DriverPaths>
            <PathAndCredentials wcm:action="add" wcm:keyValue="1">
              <Path>E:\viostor\2k22\amd64</Path>
            </PathAndCredentials>
          </DriverPaths>
        </component>
        <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <DiskConfiguration>
            <WillShowUI>Never</WillShowUI>
            <Disk wcm:action="add">
              <!-- https://foxpa.ws/win-10-11-unattended -->
              <!-- https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/configure-uefigpt-based-hard-drive-partitions?view=windows-11 -->
              <CreatePartitions>
                  <CreatePartition wcm:action="add">
                      <Order>1</Order>
                      <Type>EFI</Type>
                      <Size>100</Size>
                  </CreatePartition>
                  <CreatePartition wcm:action="add">
                      <Order>2</Order>
                      <Type>MSR</Type>
                      <Size>16</Size>
                  </CreatePartition>
                  <CreatePartition wcm:action="add">
                      <Order>3</Order>
                      <Type>Primary</Type>
                      <Extend>true</Extend>
                  </CreatePartition>
              </CreatePartitions>
              <ModifyPartitions>
                <ModifyPartition wcm:action="add">
                    <Order>1</Order>
                    <PartitionID>1</PartitionID>
                    <Label>EFI</Label>
                    <Format>FAT32</Format>
                </ModifyPartition>
                <ModifyPartition wcm:action="add">
                    <Order>2</Order>
                    <PartitionID>3</PartitionID>
                    <Label>Windows</Label>
                    <Letter>C</Letter>
                    <Format>NTFS</Format>
                </ModifyPartition>
              </ModifyPartitions>
              <DiskID>0</DiskID>
              <WillWipeDisk>true</WillWipeDisk>
            </Disk>
          </DiskConfiguration>
          <ImageInstall>
            <OSImage>
              <InstallFrom>
                <MetaData wcm:action="add">
                  <Key>/Image/Description</Key>
                  <Value>Windows Server 2025 SERVERSTANDARDCORE</Value>
                </MetaData>
              </InstallFrom>
              <InstallTo>
                <DiskID>0</DiskID>
                <PartitionID>3</PartitionID>
              </InstallTo>
            </OSImage>
          </ImageInstall>
          <UserData>
            <AcceptEula>false</AcceptEula>
            <ProductKey>
              <Key/>
              <WillShowUI>Never</WillShowUI>
            </ProductKey>
          </UserData>
        </component>
      </settings>
      <settings pass="oobeSystem">
        <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <InputLocale>0409:00000409</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UILanguage>en-US</UILanguage>
          <UILanguageFallback>en-US</UILanguageFallback>
          <UserLocale>en-US</UserLocale>
        </component>
        <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <UserAccounts>
            <AdministratorPassword>
              <Value>Administrator</Value>
              <PlainText>true</PlainText>
            </AdministratorPassword>
          </UserAccounts>
          <AutoLogon>
            <Enabled>true</Enabled>
            <Password>
              <Value>Administrator</Value>
              <PlainText>true</PlainText>
            </Password>
            <Username>Administrator</Username>
          </AutoLogon>
          <TimeZone>UTC</TimeZone>
          <OOBE>
            <HideEULAPage>true</HideEULAPage>
            <HideLocalAccountScreen>true</HideLocalAccountScreen>
            <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
            <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
            <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
            <NetworkLocation>Work</NetworkLocation>
            <ProtectYourPC>3</ProtectYourPC>
          </OOBE>
          <FirstLogonCommands>
            <SynchronousCommand wcm:action="add">
              <Order>1</Order>
              <CommandLine>PowerShell -ExecutionPolicy Bypass -NoProfile F:\post-install.ps1</CommandLine>
              <Description>Run post-install.ps1 script</Description>
            </SynchronousCommand>
          </FirstLogonCommands>
        </component>
      </settings>
    </unattend>
  post-install.ps1: |
    Start-Transcript -Path "C:\init-transcript.log" -Append
    Write-Host "Starting post-install.ps1 script"
    # Disable OOBE auto-launch
    Write-Host "Disabling OOBE auto-launch"
    Set-SConfig -AutoLaunch $false

    # Install virtio guest drivers
    Write-Host "Installing virtio guest drivers"
    $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i E:\virtio-win-gt-x64.msi /qn /passive /norestart"
    if ($process.ExitCode -notin @(0, 3010)) {
      throw "Virtio driver installation failed with exit code $($process.ExitCode)"
    }
    Write-Host "Virtio guest drivers installed successfully"
    Write-Host "Installing virtio storage driver"
    # Install qemu guest agent
    $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i E:\guest-agent\qemu-ga-x86_64.msi /qn /passive /norestart"
    if ($process.ExitCode -notin @(0, 3010)) {
      Write-Host "QEMU guest agent installation failed with exit code $($process.ExitCode)"
      throw "QEMU guest agent installation failed with exit code $($process.ExitCode)"
    }
    # Install and enable OpenSSH Server
    write-Host "Installing and enabling OpenSSH Server"
    Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
    Start-Service sshd
    Set-Service sshd -StartupType Automatic
    if (-not (Get-NetFirewallRule -Name sshd -ErrorAction SilentlyContinue)) {
      New-NetFirewallRule -Name sshd -DisplayName OpenSSH-Server-In-TCP `
        -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
    }
    Write-Host "OpenSSH Server installed and enabled successfully"
    # Install fio
    Write-Host "Installing fio"
    $fioInstaller = "C:\fio-3.43-x86.msi"
    Invoke-WebRequest -Uri "https://github.com/axboe/fio/releases/download/fio-3.43/fio-3.43-x86.msi" -OutFile $fioInstaller
    Write-Host "Downloaded fio installer to $fioInstaller"
    $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i $fioInstaller /qn /passive /norestart"
    if ($process.ExitCode -notin @(0, 3010)) {
      Write-Host "fio installation failed with exit code $($process.ExitCode)"
      throw "fio installation failed with exit code $($process.ExitCode)"
    }
    Remove-Item $fioInstaller -Force

    # Ensure fio runs as a background server on every startup and immediately on this boot.
    Write-Host "Setting up fio to run as a background server on every startup"
    $fioDir = "C:\Program Files (x86)\fio"
    $fioExe = Join-Path $fioDir "fio.exe"
    if (-not (Test-Path $fioExe)) {
      Write-Host "fio.exe was not found at $fioExe"
      throw "fio.exe was not found at $fioExe"
    }

    $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
    $pathEntries = @()
    if ($machinePath) { $pathEntries = $machinePath -split ';' | Where-Object { $_ } }
    if ($pathEntries -notcontains $fioDir) {
      $updatedMachinePath = if ($machinePath) { $machinePath.TrimEnd(';') + ';' + $fioDir } else { $fioDir }
      [Environment]::SetEnvironmentVariable('Path', $updatedMachinePath, 'Machine')
    }
    $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')

    $serviceName = "fio-server"
    $serviceBin = "\"$fioExe\" --server"
    if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
      Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
      sc.exe delete $serviceName | Out-Null
    }
    New-Service -Name $serviceName -BinaryPathName $serviceBin -DisplayName "fio-server" -StartupType Automatic -Description "fio server" | Out-Null
    Start-Service -Name $serviceName
    Write-Host "fio Windows service created and started successfully"
    Write-Host "Post-installation script completed successfully"
    # Shut down the machine
    Stop-Computer -Force
