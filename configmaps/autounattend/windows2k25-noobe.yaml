apiVersion: v1
kind: ConfigMap
metadata:
  name: windows2k25-nooobe-autounattend
data:
  autounattend.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
      <settings pass="windowsPE">
        <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <SetupUILanguage>
            <UILanguage>en-US</UILanguage>
          </SetupUILanguage>
          <InputLocale>0409:00000409</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UILanguage>en-US</UILanguage>
          <UserLocale>en-US</UserLocale>
        </component>
        <component name="Microsoft-Windows-PnpCustomizationsWinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <DriverPaths>
            <PathAndCredentials wcm:action="add" wcm:keyValue="1">
              <Path>E:\viostor\2k22\amd64</Path>
            </PathAndCredentials>
          </DriverPaths>
        </component>
        <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <DiskConfiguration>
            <WillShowUI>Never</WillShowUI>
            <Disk wcm:action="add">
              <!-- https://foxpa.ws/win-10-11-unattended -->
              <!-- https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/configure-uefigpt-based-hard-drive-partitions?view=windows-11 -->
              <CreatePartitions>
                  <CreatePartition wcm:action="add">
                      <Order>1</Order>
                      <Type>EFI</Type>
                      <Size>100</Size>
                  </CreatePartition>
                  <CreatePartition wcm:action="add">
                      <Order>2</Order>
                      <Type>MSR</Type>
                      <Size>16</Size>
                  </CreatePartition>
                  <CreatePartition wcm:action="add">
                      <Order>3</Order>
                      <Type>Primary</Type>
                      <Extend>true</Extend>
                  </CreatePartition>
              </CreatePartitions>
              <ModifyPartitions>
                <ModifyPartition wcm:action="add">
                    <Order>1</Order>
                    <PartitionID>1</PartitionID>
                    <Label>EFI</Label>
                    <Format>FAT32</Format>
                </ModifyPartition>
                <ModifyPartition wcm:action="add">
                    <Order>2</Order>
                    <PartitionID>3</PartitionID>
                    <Label>Windows</Label>
                    <Letter>C</Letter>
                    <Format>NTFS</Format>
                </ModifyPartition>
              </ModifyPartitions>
              <DiskID>0</DiskID>
              <WillWipeDisk>true</WillWipeDisk>
            </Disk>
          </DiskConfiguration>
          <ImageInstall>
            <OSImage>
              <InstallFrom>
                <MetaData wcm:action="add">
                  <Key>/Image/Description</Key>
                  <Value>Windows Server 2025 SERVERSTANDARDCORE</Value>
                </MetaData>
              </InstallFrom>
              <InstallTo>
                <DiskID>0</DiskID>
                <PartitionID>3</PartitionID>
              </InstallTo>
            </OSImage>
          </ImageInstall>
          <UserData>
            <AcceptEula>false</AcceptEula>
            <ProductKey>
              <Key/>
              <WillShowUI>Never</WillShowUI>
            </ProductKey>
          </UserData>
        </component>
      </settings>
      <settings pass="oobeSystem">
        <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <InputLocale>0409:00000409</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UILanguage>en-US</UILanguage>
          <UILanguageFallback>en-US</UILanguageFallback>
          <UserLocale>en-US</UserLocale>
        </component>
        <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <UserAccounts>
            <AdministratorPassword>
              <Value>Administrator</Value>
              <PlainText>true</PlainText>
            </AdministratorPassword>
          </UserAccounts>
          <AutoLogon>
            <Enabled>true</Enabled>
            <Password>
              <Value>Administrator</Value>
              <PlainText>true</PlainText>
            </Password>
            <Username>Administrator</Username>
          </AutoLogon>
          <TimeZone>UTC</TimeZone>
          <OOBE>
            <HideEULAPage>true</HideEULAPage>
            <HideLocalAccountScreen>true</HideLocalAccountScreen>
            <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
            <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
            <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
            <NetworkLocation>Work</NetworkLocation>
            <ProtectYourPC>3</ProtectYourPC>
          </OOBE>
          <FirstLogonCommands>
            <SynchronousCommand wcm:action="add">
              <Order>1</Order>
              <CommandLine>PowerShell -ExecutionPolicy Bypass -NoProfile F:\post-install.ps1</CommandLine>
              <Description>Run post-install.ps1 script</Description>
            </SynchronousCommand>
          </FirstLogonCommands>
        </component>
      </settings>
    </unattend>
  post-install.ps1: |
    param(
      [switch]$Resume
    )

    Function Download-File($uri, $outFile) {
      Write-Host "Downloading the file from $uri to $outFile"
      $ProgressPreference = "SilentlyContinue"
      Invoke-WebRequest -Uri $uri -OutFile $outFile
      $ProgressPreference = "Continue"
      Write-Host "File downloaded"
    }

    Start-Transcript -Path "C:\init-transcript.log" -Append

    if (-not $Resume) {
      Set-SConfig -AutoLaunch $false

      # Install virtio guest drivers
      $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i E:\virtio-win-gt-x64.msi /qn /passive /norestart"
      if ($process.ExitCode -notin @(0, 3010)) {
        throw "Virtio driver installation failed with exit code $($process.ExitCode)"
      }

      # Install qemu guest agent
      $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i E:\guest-agent\qemu-ga-x86_64.msi /qn /passive /norestart"
      if ($process.ExitCode -notin @(0, 3010)) {
        throw "QEMU guest agent installation failed with exit code $($process.ExitCode)"
      }

      Download-File "https://github.com/microsoft/WSL/releases/download/2.3.26/wsl.2.3.26.0.x64.msi" "C:\wsl.msi"
      $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i C:\wsl.msi /qn /passive /norestart"
      if ($process.ExitCode -notin @(0, 3010)) {
        throw "WSL MSI installation failed with exit code $($process.ExitCode)"
      }
      Remove-Item "C:\wsl.msi"

      dism.exe /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart
      if ($LASTEXITCODE -notin @(0, 3010)) {
        throw "Enabling Microsoft-Windows-Subsystem-Linux failed with exit code $LASTEXITCODE"
      }
      dism.exe /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart
      if ($LASTEXITCODE -notin @(0, 3010)) {
        throw "Enabling VirtualMachinePlatform failed with exit code $LASTEXITCODE"
      }

      Copy-Item "F:\post-install.ps1" "C:\post-install.ps1" -Force
      $action = New-ScheduledTaskAction -Execute "PowerShell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -File C:\post-install.ps1 -Resume"
      $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:USERNAME
      $principal = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -LogonType Interactive -RunLevel Highest
      Register-ScheduledTask -TaskName "ContinueWindowsPostInstall" -Action $action -Trigger $trigger -Principal $principal -Force

      Write-Host "WSL features enabled. Rebooting before Ubuntu installation."
      Restart-Computer -Force
      return
    }

    Unregister-ScheduledTask -TaskName "ContinueWindowsPostInstall" -Confirm:$false -ErrorAction SilentlyContinue

    # Import Ubuntu after the WSL feature reboot. Direct import avoids the
    # Store-style distro registration path used by wsl --install.
    Write-Host "Installing Ubuntu..."
    $ubuntuRootfs = "C:\noble-wsl-amd64.wsl"
    $ubuntuInstallPath = "C:\WSL\Ubuntu"
    Download-File "https://cdimages.ubuntu.com/ubuntu-wsl/noble/daily-live/current/noble-wsl-amd64.wsl" $ubuntuRootfs
    New-Item -ItemType Directory -Path $ubuntuInstallPath -Force | Out-Null
    wsl.exe --set-default-version 2
    wsl.exe --import Ubuntu $ubuntuInstallPath $ubuntuRootfs --version 2
    if ($LASTEXITCODE -ne 0) {
      throw "Ubuntu import failed with exit code 0x{0:X8}" -f $LASTEXITCODE
    }
    Remove-Item $ubuntuRootfs -Force

    #wait until the ubuntu VM is available
    $ubuntuAvailable = $false
    for ($attempt = 1; $attempt -le 30; $attempt++) {
      Write-Host "Ubuntu not available. Waiting..."
      $process = Start-Process -FilePath "wsl.exe" -ArgumentList "-d Ubuntu -u root -- apt-get update" -Wait -PassThru -NoNewWindow
      if ($process.ExitCode -eq 0) {
        $ubuntuAvailable = $true
        break
      }
      Start-Sleep -Seconds 10
    }
    if (-not $ubuntuAvailable) {
      wsl --status
      wsl --list --verbose
      throw "Ubuntu did not become ready"
    }

    # Install packages in WSL
    Write-Host "Installing packages in WSL..."
    try {
      $process = Start-Process -FilePath "wsl" -ArgumentList "-u root apt-get install -y nc wget fio ioping sysstat ethtool bc tmux vim iputils bwm-ng net-tools procps openssh-server jq curl iperf3" -Passthru
      Wait-Process $process.id
      if ($process.exitcode -ne 0) {
        throw "Package installation in WSL failed with exit code $($process.exitcode)"
      }
    }
    catch {
      Write-Host "Failed to install packages in WSL: $_"
    }
    # Install and enable OpenSSH Server
    Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
    Start-Service sshd
    Set-Service sshd -StartupType Automatic
    if (-not (Get-NetFirewallRule -Name sshd -ErrorAction SilentlyContinue)) {
      New-NetFirewallRule -Name sshd -DisplayName OpenSSH-Server-In-TCP `
        -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
    }
    # Shut down the machine
    Stop-Computer -Force
